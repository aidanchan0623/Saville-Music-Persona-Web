services:
  saville-web:
    build:
      context: .
    image: saville-music-persona-web:local
    restart: unless-stopped
    init: true
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      SMP_DEPLOYMENT_MODE: anonymous
      SMP_SERVE_FRONTEND: "true"
      SMP_DATA_DIR: /var/lib/saville
      SMP_SESSION_COOKIE_SECURE: "false"
      SMP_SESSION_COOKIE_SAMESITE: lax
      SMP_SESSION_TTL_HOURS: "24"
      SMP_ANONYMOUS_MAX_UPLOAD_BYTES: "104857600"
      SMP_ANONYMOUS_MAX_EVENTS: "250000"
      SMP_ANONYMOUS_UPLOADS_PER_HOUR: "4"
      SMP_ANONYMOUS_MAX_CONCURRENT_IMPORTS: "2"
      SMP_HOSTED_LLM_PROVIDER: ${SMP_HOSTED_LLM_PROVIDER:-disabled}
      SMP_HOSTED_LLM_BASE_URL: ${SMP_HOSTED_LLM_BASE_URL:-https://api.openai.com/v1}
      SMP_HOSTED_LLM_API_KEY: ${SMP_HOSTED_LLM_API_KEY:-}
      SMP_HOSTED_LLM_MODEL: ${SMP_HOSTED_LLM_MODEL:-}
      SMP_HOSTED_LLM_TIMEOUT_SECONDS: ${SMP_HOSTED_LLM_TIMEOUT_SECONDS:-20}
      SMP_HOSTED_LLM_MAX_OUTPUT_TOKENS: ${SMP_HOSTED_LLM_MAX_OUTPUT_TOKENS:-700}
      SMP_HOSTED_LLM_REQUESTS_PER_SESSION_HOUR: ${SMP_HOSTED_LLM_REQUESTS_PER_SESSION_HOUR:-4}
      SMP_HOSTED_LLM_REQUESTS_GLOBAL_DAY: ${SMP_HOSTED_LLM_REQUESTS_GLOBAL_DAY:-200}
      SMP_REPORT_GENERATION_TIMEOUT_SECONDS: ${SMP_REPORT_GENERATION_TIMEOUT_SECONDS:-35}
      SMP_ANONYMOUS_MAX_CONCURRENT_REPORTS: ${SMP_ANONYMOUS_MAX_CONCURRENT_REPORTS:-2}
      WEB_CONCURRENCY: "1"
    volumes:
      - saville-data:/var/lib/saville

volumes:
  saville-data:
