name: Hosted Web CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/aidanchan0623/saville-music-persona-web

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm test --prefix frontend -- --run
      - run: npm run build --prefix frontend

  container:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag "$IMAGE_NAME:${GITHUB_SHA}" .
      - name: Smoke-test bundled frontend and API
        shell: bash
        run: |
          docker run --detach --name saville-smoke --publish 8000:8000 \
            --env SMP_SESSION_COOKIE_SECURE=false \
            "$IMAGE_NAME:${GITHUB_SHA}"
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs saville-smoke
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:8000/ | grep --quiet "Saville Music Persona"
          docker rm --force saville-smoke
      - name: Publish main image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE_NAME:${GITHUB_SHA}" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$IMAGE_NAME:latest"
