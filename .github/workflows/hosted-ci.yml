name: Hosted Web CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/aidanchan0623/saville-music-persona-web

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm test --prefix frontend -- --run
      - run: npm run build --prefix frontend
      - name: Install responsive-test browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify mobile, tablet, and desktop layouts
        shell: bash
        env:
          SMP_DEPLOYMENT_MODE: anonymous
          SMP_SESSION_COOKIE_SECURE: "false"
          SMP_SERVE_FRONTEND: "true"
          SMP_FRONTEND_DIST_DIR: ${{ github.workspace }}/frontend/dist
          SMP_DATA_DIR: ${{ runner.temp }}/saville-responsive
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
        run: |
          python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 >"${RUNNER_TEMP}/saville-responsive.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "${RUNNER_TEMP}/saville-responsive.log"
            exit 1
          fi
          npm run test:responsive --prefix frontend

  container:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build --tag "$IMAGE_NAME:${GITHUB_SHA}" .
      - name: Smoke-test bundled frontend and API
        shell: bash
        run: |
          docker run --detach --name saville-smoke --publish 8000:8000 \
            --env SMP_SESSION_COOKIE_SECURE=false \
            "$IMAGE_NAME:${GITHUB_SHA}"
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs saville-smoke
            exit 1
          fi
          python3 scripts/hosted_preflight.py http://127.0.0.1:8000 --allow-insecure-cookie
          docker rm --force saville-smoke
      - name: Publish main image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE_NAME:${GITHUB_SHA}" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$IMAGE_NAME:latest"
